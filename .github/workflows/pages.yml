name: Pages

on:
  push:
    branches:
      - master # default branch

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
      - name: Cancel superseded Pages runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=${GITHUB_REF_NAME}&status=in_progress&per_page=20" \
            | jq -r --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select((.id | tostring) != $current) | .cancel_url' \
            | while IFS= read -r cancel_url; do
                curl -fsSL -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$cancel_url"
              done
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          # Examples: 20, 18.19, >=16.20.2, lts/Iron, lts/Hydrogen, *, latest, current, node
          # Ref: https://github.com/actions/setup-node#supported-version-syntax
          node-version: "22"
      - name: Cache NPM dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Restore AI translations
        id: translation-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/oyster-translations
          key: ${{ runner.OS }}-oyster-translations-${{ hashFiles('source/**/*.md', 'tools/translate-site.mjs', 'translation.config.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.OS }}-oyster-translations-${{ hashFiles('source/**/*.md', 'tools/translate-site.mjs', 'translation.config.json') }}-
            ${{ runner.OS }}-oyster-translations-
      - name: Install Dependencies
        run: npm install
      - name: Build the translated site
        env:
          OYSTER_TRANSLATION_PROVIDER: google
          OYSTER_TRANSLATION_REQUIRED: "1"
        run: npm run build
      - name: Save AI translation cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/oyster-translations
          key: ${{ runner.OS }}-oyster-translations-${{ hashFiles('source/**/*.md', 'tools/translate-site.mjs', 'translation.config.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
