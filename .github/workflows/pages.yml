name: Pages

on:
  push:
    branches:
      - master # default branch

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # If your repository depends on submodule, please see: https://github.com/actions/checkout
          submodules: recursive
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          # Examples: 20, 18.19, >=16.20.2, lts/Iron, lts/Hydrogen, *, latest, current, node
          # Ref: https://github.com/actions/setup-node#supported-version-syntax
          node-version: "22"
      - name: Cache NPM dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Restore AI translations
        id: translation-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/oyster-translations
          key: ${{ runner.OS }}-oyster-translations-${{ hashFiles('source/**/*.md', 'tools/translate-site.mjs', 'translation.config.json') }}
          restore-keys: |
            ${{ runner.OS }}-oyster-translations-
      - name: Restore Qwen model on the GitHub runner
        id: qwen-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/oyster-ollama-models
          key: ${{ runner.OS }}-${{ runner.arch }}-ollama-qwen3-8b-v1
      - name: Install Dependencies
        run: npm install
      - name: Install Ollama on the GitHub runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | zstd -d | sudo tar -xf - -C /usr
          ollama --version
      - name: Download Qwen on the GitHub runner
        env:
          OLLAMA_MODELS: ${{ runner.temp }}/oyster-ollama-models
          OLLAMA_NUM_PARALLEL: "1"
        run: |
          ollama serve > "$RUNNER_TEMP/oyster-ollama.log" 2>&1 &
          ollama_pid=$!
          trap 'kill "$ollama_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || {
            tail -100 "$RUNNER_TEMP/oyster-ollama.log"
            exit 1
          }
          ollama pull qwen3:8b
      - name: Save Qwen model cache
        if: always() && steps.qwen-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/oyster-ollama-models
          key: ${{ runner.OS }}-${{ runner.arch }}-ollama-qwen3-8b-v1
      - name: Build the translated site
        env:
          OLLAMA_MODELS: ${{ runner.temp }}/oyster-ollama-models
          OLLAMA_NUM_PARALLEL: "1"
          OYSTER_TRANSLATION_PROVIDER: ollama
          OYSTER_TRANSLATION_REQUIRED: "1"
        run: |
          ollama serve > "$RUNNER_TEMP/oyster-ollama.log" 2>&1 &
          ollama_pid=$!
          trap 'kill "$ollama_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || {
            tail -100 "$RUNNER_TEMP/oyster-ollama.log"
            exit 1
          }
          if ! npm run build; then
            tail -40 "$RUNNER_TEMP/oyster-ollama.log" | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::warning title=Ollama server log::$line"
            done
            exit 1
          fi
      - name: Save AI translation cache
        if: always() && steps.translation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/oyster-translations
          key: ${{ runner.OS }}-oyster-translations-${{ hashFiles('source/**/*.md', 'tools/translate-site.mjs', 'translation.config.json') }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
